name: ai-support-platform

services:
  postgres:
    image: postgres:16-alpine
    container_name: asp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: support_platform
    ports:
      - "5432:5432"
    volumes:
      - asp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: asp-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - asp_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  asp_postgres_data:
  asp_redis_data:
